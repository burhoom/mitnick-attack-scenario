---
# Deploys the official SEED "Mitnick Attack Lab" Docker Compose stack inside
# this one VM. See topology.yml for why this is one host, not three.

- name: Check if Docker and Compose v2 are already installed
  ansible.builtin.command: docker compose version
  register: docker_compose_check
  changed_when: false
  failed_when: false

- name: Install Docker Engine and Compose v2 if missing
  when: docker_compose_check.rc != 0
  block:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-pip
        state: present
        update_cache: true

    - name: Create /etc/apt/keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker's official GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

- name: Ensure Docker service is running and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add 'seed' to the docker group
  ansible.builtin.user:
    name: seed
    groups: docker
    append: true

- name: Reset SSH connection so docker group membership takes effect
  ansible.builtin.meta: reset_connection

# --- Convenience aliases, matching the official SEED Lab manual exactly ---
- name: Add dockps/docksh/dcbuild/dcup/dcdown aliases
  ansible.builtin.blockinfile:
    path: /home/seed/.bashrc
    create: true
    owner: seed
    group: seed
    block: |
      alias dcbuild='docker compose build'
      alias dcup='docker compose up -d'
      alias dcdown='docker compose down'
      alias dockps='docker ps --format "{{ "{{.ID}} {{.Names}}" }}"'
      alias docksh='f(){ docker exec -it "$1" /bin/bash; }; f'

# --- Ship the Labsetup folder ---
- name: Create Labsetup directory tree
  ansible.builtin.file:
    path: "/home/seed/Labsetup/{{ item }}"
    state: directory
    owner: seed
    group: seed
  loop:
    - xterminal
    - trustedserver
    - attacker
    - volumes
    - secrets

- name: Copy docker-compose.yml
  ansible.builtin.copy:
    src: Labsetup/docker-compose.yml
    dest: /home/seed/Labsetup/docker-compose.yml
    owner: seed
    group: seed

- name: Copy xterminal container files
  ansible.builtin.copy:
    src: "Labsetup/xterminal/"
    dest: /home/seed/Labsetup/xterminal/
    owner: seed
    group: seed

- name: Copy trustedserver container files
  ansible.builtin.copy:
    src: "Labsetup/trustedserver/"
    dest: /home/seed/Labsetup/trustedserver/
    owner: seed
    group: seed

- name: Copy attacker container files
  ansible.builtin.copy:
    src: "Labsetup/attacker/"
    dest: /home/seed/Labsetup/attacker/
    owner: seed
    group: seed

- name: Copy attacker exploit skeleton scripts into the shared volume
  ansible.builtin.copy:
    src: "Labsetup/volumes/"
    dest: /home/seed/Labsetup/volumes/
    owner: seed
    group: seed

# --- Plant the per-student APG flags. NEVER self-generate these: use the
#     injected {{ flag_hijack }} / {{ flag_backdoor }} values directly, or
#     the platform's answer check will never match (see Gotcha #1). ---
- name: Plant flag_hijack (templated, not self-generated)
  ansible.builtin.template:
    src: flag.txt.j2
    dest: /home/seed/Labsetup/secrets/flag_hijack.txt
    owner: seed
    group: seed
    mode: "0644"
  vars:
    flag_value: "{{ flag_hijack }}"

- name: Plant flag_backdoor (templated, not self-generated)
  ansible.builtin.template:
    src: flag.txt.j2
    dest: /home/seed/Labsetup/secrets/flag_backdoor.txt
    owner: seed
    group: seed
    mode: "0644"
  vars:
    flag_value: "{{ flag_backdoor }}"

- name: Build and start the lab containers
  community.docker.docker_compose_v2:
    project_src: /home/seed/Labsetup
    build: always
    state: present
  become_user: seed

# Gotcha carried over from the buffer-overflow lab: `docker compose up -d`
# can return success while a container dies seconds later (e.g. seccomp
# killing a privileged/host-mode container). Always verify, don't trust
# the exit code alone.
- name: Confirm all three containers are actually running
  ansible.builtin.command: docker ps --filter "status=running" --format "{{ '{{.Names}}' }}"
  register: running_containers
  changed_when: false

- name: Fail loudly (with logs) if a container did not stay up
  block:
    - name: Assert xterminal, trustedserver and attacker are all running
      ansible.builtin.assert:
        that:
          - "'xterminal-10.9.0.5' in running_containers.stdout"
          - "'trustedserver-10.9.0.6' in running_containers.stdout"
          - "'attacker' in running_containers.stdout"
        fail_msg: "One or more Mitnick lab containers exited after startup — dumping logs below."
  rescue:
    - name: Dump logs from every container to help diagnose
      ansible.builtin.command: docker compose logs
      args:
        chdir: /home/seed/Labsetup
      register: compose_logs
    - name: Print container logs
      ansible.builtin.debug:
        var: compose_logs.stdout_lines
    - name: Abort provisioning
      ansible.builtin.fail:
        msg: "Mitnick lab containers failed to start — see logs above."
